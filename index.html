<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
  <title>あみだくじ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🎮 ゲーム画面 -->
  <div id="game-screen" class="app-container">
    <div class="amida-area">
      <div class="lines-wrapper" id="lines-wrapper">
        <img id="bg-line-img" class="bg-line-img" src="" alt="あみだ背景">
        <div id="start-node-container" class="node-row"></div>
        <div id="goal-node-container" class="node-row"></div>
      </div>
    </div>
  </div>

  <!-- 🎁 結果画面 -->
  <div id="result-screen" class="app-container hidden result-layout">
    <div class="result-section title-section">
      <h1 id="result-title" class="result-title"></h1>
    </div>
    <div class="result-section text-section">
      <p id="result-main-text" class="result-main-text"></p>
      <p id="result-sub-text" class="result-sub-text"></p>
    </div>
    <div class="result-section chara-section">
      <img id="result-chara-img" class="result-chara" src="" alt="キャラクター">
    </div>
    <div class="result-section btn-section">
      <button id="share-btn" class="btn btn-share" style="margin-bottom: 12px;">結果をXでシェアする🕊️</button>
      <button id="reset-btn" class="btn btn-reset">もう一度ひく🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
