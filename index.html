<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日の運勢あみだくじ！</title>
  <!-- 必要なフォントの読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Cherry+Bomb+One&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 🎮 ゲーム画面 -->
    <div id="game-screen" class="amida-area">
      <div class="lines-wrapper" id="lines-wrapper">
        <img id="bg-line-img" class="bg-line-img" src="" alt="あみだくじ背景">
        <div id="start-node-container" class="node-row"></div>
        <div id="goal-node-container" class="node-row"></div>
        <div id="runner" class="runner hidden"></div>
      </div>
    </div>

    <!-- 🎁 結果画面 -->
    <div id="result-screen" class="result-layout hidden">
      <div class="result-section title-section">
        <h1 id="result-title" class="result-title"></h1>
      </div>
      <div class="result-section text-section">
        <div id="result-main-text" class="result-main-text"></div>
        <div id="result-sub-text" class="result-sub-text"></div>
      </div>
      <div class="result-section chara-section">
        <img id="result-chara-img" class="result-chara" src="" alt="結果キャラ">
      </div>
      <div class="result-section btn-section">
        <button id="share-btn" class="btn btn-share">結果をXでシェアする🕊</button>
        <button id="reset-btn" class="btn btn-reset">もう一度遊ぶ</button>
      </div>
    </div>
  </div>
</body>
</html>
